# Pulse's own isolated nginx (serves the SPA + proxies the API). This is NOT
# the user's Nginx and never modifies it. See docs/SAFETY_MODEL.md.
# Only send "Connection: upgrade" for requests that actually ask to upgrade —
# sending it unconditionally breaks keep-alive for ordinary API calls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP is also set by the API for its responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health to the control-plane service.
    location /api/ {
        proxy_pass http://pulse-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The SSH console holds a WebSocket open for as long as the terminal is
        # on screen; the default 60s read timeout would cut it off.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location /healthz {
        proxy_pass http://pulse-api:8080;
    }
}
