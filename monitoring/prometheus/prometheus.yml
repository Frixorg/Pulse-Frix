# Pulse Prometheus configuration. Scrapes the isolated monitoring components
# only. The user-facing dashboard never talks to Prometheus directly — the API
# abstracts it (docs/MONITORING.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pulse

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["pulse-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["pulse-cadvisor:8080"]

  # Pulse's own API exposes internal metrics (self-observability).
  - job_name: pulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["pulse-api:8080"]
