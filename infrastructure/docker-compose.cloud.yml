# =============================================================================
# Pulse Cloud control plane (for pulse.frix.me). Runs the multi-tenant API +
# dashboard + PostgreSQL + monitoring, fronted by Caddy for automatic TLS.
# There is NO agent here — agents run on each monitored VPS and connect OUTBOUND.
#
# Deploy on the host that pulse.frix.me points to:
#   cp .env.cloud.example .env   # then edit secrets + DASHBOARD_DOMAIN
#   docker compose -f infrastructure/docker-compose.cloud.yml --env-file .env up -d
#
# Requires: DNS A/AAAA record for DASHBOARD_DOMAIN -> this host, ports 80+443 open.
# =============================================================================
name: pulse-cloud

networks:
  pulse-net:
    name: pulse-net
    driver: bridge

volumes:
  pulse-postgres-data:
  pulse-prometheus-data:
  pulse-agent-data:
  caddy-data:
  caddy-config:

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: pulse-caddy
    restart: unless-stopped
    # Caddy is OPT-IN: only runs with `--profile edge`, for hosts that have
    # nothing on 80/443. If the box already has a web server (e.g. a mail
    # server), leave this off and reverse-proxy the domain to the dashboard's
    # local port instead (see docs/DEPLOYMENT.md).
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [pulse-dashboard]
    networks: [pulse-net]

  pulse-postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: pulse
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data
    networks: [pulse-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  pulse-api:
    build:
      context: ../apps/api
      args:
        # Default: in-memory store (zero external deps, always builds).
        # For durable Postgres storage set API_TAGS=pgx in your .env and rebuild
        # (see the persistence note in docs/DEPLOYMENT.md).
        TAGS: ${API_TAGS:-}
    container_name: pulse-api
    restart: unless-stopped
    environment:
      PULSE_API_ADDR: ":8080"
      PULSE_MODE: cloud # multi-tenant
      PULSE_ENV: production
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD}@pulse-postgres:5432/pulse?sslmode=disable
      METRICS_URL: http://pulse-prometheus:9090
      PULSE_SESSION_SECRET: ${PULSE_SESSION_SECRET:-}
      PULSE_JWT_SIGNING_KEY: ${PULSE_JWT_SIGNING_KEY:-}
      PULSE_BOOTSTRAP_EMAIL: ${PULSE_BOOTSTRAP_EMAIL:-}
      PULSE_BOOTSTRAP_PASSWORD: ${PULSE_BOOTSTRAP_PASSWORD:-}
      # OIDC — used to build redirect URIs and configure providers.
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_ISSUER: ${TELEGRAM_ISSUER:-}
      TELEGRAM_SCOPES: ${TELEGRAM_SCOPES:-}
    depends_on:
      pulse-postgres:
        condition: service_healthy
    networks: [pulse-net]
    mem_limit: 512m

  pulse-dashboard:
    build:
      context: ../apps/dashboard
    container_name: pulse-dashboard
    restart: unless-stopped
    # Publish the dashboard on a LOCAL port so an existing web server can
    # reverse-proxy the domain to it. Default binds to loopback only (safe);
    # override with DASHBOARD_BIND (e.g. "0.0.0.0:8090") if you need it exposed.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1:8090}:80"
    depends_on: [pulse-api]
    networks: [pulse-net]
    mem_limit: 128m

  pulse-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pulse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-30d}
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - pulse-prometheus-data:/prometheus
    networks: [pulse-net]
    mem_limit: 512m

  pulse-node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: pulse-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [pulse-net]
    mem_limit: 128m

  # OPT-IN agent to monitor THIS host from your own dashboard.
  # 1) Sign in to the dashboard → Settings → Generate enrollment token
  # 2) Put it in .env as AGENT_ENROLLMENT_TOKEN=pst_...
  # 3) docker compose -f infrastructure/docker-compose.cloud.yml --env-file .env --profile agent up -d pulse-agent
  # Uses host network + pid for accurate discovery, and reaches the API through
  # the dashboard's local port (127.0.0.1:8090). Docker socket is READ-ONLY.
  pulse-agent:
    build:
      context: ../agent
    container_name: pulse-agent
    profiles: ["agent"]
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      PULSE_MODE: cloud
      PULSE_API_URL: http://127.0.0.1:8090
      PULSE_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-}
      PULSE_DATA_DIR: /data
      PULSE_ROOTFS: /host
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - pulse-agent-data:/data
      # READ-ONLY host visibility for accurate discovery + disk metrics.
      - /:/host:ro,rslave
      - /etc/nginx:/etc/nginx:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 128m
