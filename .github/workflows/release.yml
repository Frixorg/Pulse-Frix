name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build, checksum & SBOM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build agent + CLI
        working-directory: agent
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          ver=${GITHUB_REF_NAME}
          ld="-s -w -X github.com/frix-me/pulse/agent/internal/version.Version=${ver} -X github.com/frix-me/pulse/agent/internal/version.Commit=${GITHUB_SHA::7}"
          go build -trimpath -ldflags "$ld" -o ../dist/pulse-agent-$suffix ./cmd/pulse-agent
          go build -trimpath -ldflags "$ld" -o ../dist/pulse-$suffix ./cmd/pulse

      - name: Checksums
        run: |
          cd dist && sha256sum * > checksums-${{ matrix.target.goarch }}.txt

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./agent
          format: spdx-json
          output-file: dist/agent-sbom-${{ matrix.target.goarch }}.spdx.json

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
