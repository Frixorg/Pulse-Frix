name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false # no go.sum (stdlib-only module); caching would error
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  dashboard:
    name: Dashboard (Vue/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Build (Vite)
        run: npm run build
      - name: Type check (informational)
        run: npm run typecheck
        continue-on-error: true

  installer:
    name: Installer (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors only)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error installer/install.sh installer/uninstall.sh installer/lib/common.sh tests/non-destructive/run.sh tests/non-destructive/snapshot.sh

  nondestructive:
    name: Non-destructive install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run non-destructive test suite
        run: bash tests/non-destructive/run.sh
