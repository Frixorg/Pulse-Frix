# Pulse Alertmanager: debounce, grouping, dedup, and recovery notifications.
# Notifier receivers are intentionally empty by default (safe default) — the API
# consumes alerts and surfaces them in the dashboard. Configure receivers to add
# email/Slack/webhook delivery.
route:
  group_by: ["alertname", "instance", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default

inhibit_rules:
  # Dependency-aware correlation: a critical disk alert inhibits noisier
  # symptom warnings on the same instance (root cause over symptoms).
  - source_matchers: [alertname="DiskCritical"]
    target_matchers: [severity="warning"]
    equal: ["instance"]
