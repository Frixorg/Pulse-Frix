# =============================================================================
# Cloud-mode footprint: just the agent (+ local exporters), shipping OUTBOUND to
# Pulse Cloud. No dashboard, API or database run locally in cloud mode — the
# dashboard lives at pulse.frix.me. No inbound port is opened. See
# docs/CLOUD_MODE.md.
# =============================================================================
name: pulse

networks:
  pulse-net:
    name: pulse-net
    driver: bridge

volumes:
  pulse-agent-data:

services:
  pulse-agent:
    build:
      context: ../agent
    container_name: pulse-agent
    restart: unless-stopped
    environment:
      PULSE_MODE: cloud
      PULSE_API_URL: ${PULSE_API_URL:-https://pulse.frix.me}
      PULSE_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-}
      PULSE_DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - pulse-agent-data:/data
    networks: [pulse-net]
    mem_limit: 128m

  pulse-node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: pulse-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [pulse-net]
    mem_limit: 128m
