# =============================================================================
# Cloud-mode footprint for a MONITORED VPS: just the agent, shipping OUTBOUND to
# Pulse Cloud. No dashboard, API, database or exporters run here — the agent
# collects host + Docker metrics itself and sends them. No inbound port is
# opened. See docs/CLOUD_MODE.md.
#
# NOTE: do not run this on the host that IS the Pulse cloud control plane; that
# host monitors itself via the `--profile agent` service in
# docker-compose.cloud.yml instead.
# =============================================================================
name: pulse

volumes:
  pulse-agent-data:

services:
  pulse-agent:
    build:
      context: ../agent
    container_name: pulse-agent
    restart: unless-stopped
    # Host network + pid = accurate discovery (ports, processes) and a clean
    # outbound path to the cloud. Docker socket is READ-ONLY.
    network_mode: host
    pid: host
    environment:
      PULSE_MODE: cloud
      PULSE_API_URL: ${PULSE_API_URL:-https://pulse.frix.me}
      PULSE_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-}
      PULSE_DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - pulse-agent-data:/data
    mem_limit: 128m
